# IMPORTANT: All values below are plain text because this Secret uses stringData.
# Replace them before applying in production.
#
# Simple lab model:
#   - Keep this Secret static in the repo.
#   - Fill the values manually with Terraform outputs before applying.
#   - Do not wire External Secrets or other sync mechanisms yet.
#
# Terraform outputs used here:
#   - MONGO_URI
#   - REDIS_URL
#   - SQS_BETS_QUEUE_URL
#   - SQS_SETTLEMENT_QUEUE_URL
#   - SNS_RESULTS_TOPIC_ARN
#
# IAM note: the backend and controller rely on the pre-created lab roles.
# No static AWS keys are needed in the Kubernetes Secret.
apiVersion: v1
kind: Secret
metadata:
  name: t28bet-secret
  namespace: t28bet
type: Opaque
stringData:
  MONGO_URI: mongodb://mongo-svc:27017/t28bet
  JWT_SECRET: REPLACE_WITH_REAL_SECRET_IN_PRODUCTION
  REDIS_URL: redis://lab-eks-app-redis.gh2hx9.ng.0001.use1.cache.amazonaws.com:6379
  SQS_BETS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/767397683649/lab-eks-app-bets
  SQS_SETTLEMENT_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/767397683649/lab-eks-app-settlement
  SNS_RESULTS_TOPIC_ARN: arn:aws:sns:us-east-1:767397683649:lab-eks-app-topic
